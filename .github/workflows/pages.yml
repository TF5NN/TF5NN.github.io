name: Build and publish

# Every time something changes on the main branch, this builds the site
# and puts it on GitHub Pages. It can also be started by hand from the
# Actions tab ("Run workflow").
#
# While the repository is PRIVATE this does nothing at all, on purpose:
# nothing is built and nothing is published. It starts working once the
# repository is made public and Pages is switched on (see the README).
on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The version of Hugo (the site builder) this site was made with.
      HUGO_VERSION: 0.169.0
    steps:
      - uses: actions/checkout@v7
      - name: Install Hugo
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the site
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
