{{- /* The EN / IS buttons. Each goes to the same page in that language. */ -}}
{{- $page := . -}}
<nav class="lang-switch" aria-label="{{ T "language" }}">
  {{- range hugo.Sites }}
  {{- $lang := .Language.Lang }}
  <a href="{{ partial "lang-url.html" (dict "page" $page "lang" $lang) }}" lang="{{ $lang }}" hreflang="{{ $lang }}" title="{{ .Language.Label }}"{{ if eq $lang site.Language.Lang }} aria-current="true"{{ end }}>{{ upper $lang }}</a>
  {{- end }}
</nav>
