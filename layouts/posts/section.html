{{ define "main" }}
<header class="page-head">
  <h1>{{ .Title }}</h1>
  {{- with .Params.summary }}<p class="lede">{{ . }}</p>{{ end }}
</header>
<section class="log">
  {{- range (.Paginate .RegularPages).Pages }}
  {{ partial "entry.html" (dict "page" . "h" "h2") }}
  {{- else }}
  <p class="empty">{{ T "no_posts" }}</p>
  {{- end }}
</section>
{{ partial "pager.html" . }}
{{ end }}
